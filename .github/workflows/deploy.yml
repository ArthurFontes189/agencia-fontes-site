name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Move build to root (for GitHub Pages)
        run: |
          # Remove old build files except .git
          find . -maxdepth 1 -type f -not -name '.*' -not -name 'package*' -not -name 'README*' -not -name 'astro*' -not -name 'tsconfig*' -not -name 'tailwind*' -delete
          find . -maxdepth 1 -type d -not -name '.' -not -name '.git' -not -name 'node_modules' -not -name '.github' -not -name 'public' -not -name 'src' -delete
          # Copy dist files to root
          cp -r dist/* .

      - name: Commit build
        run: |
          git config user.name "Deploy Bot"
          git config user.email "deploy@github.com"
          git add . -f
          git commit -m "build: compilar site" || true
          git push

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug - Check files
        run: |
          echo "=== Files in dist ==="
          ls -la dist/
          echo "=== Index.html exists? ==="
          test -f dist/index.html && echo "✓ index.html found" || echo "✗ index.html NOT found"

      - name: Deploy
        run: |
          mkdir -p deploy
          cp -r dist/* deploy/
          cd deploy
          ls -la
          git init
          git config user.name "Deploy Bot"
          git config user.email "deploy@github.com"
          git add -A
          git commit -m "Deploy from main"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
